name: Mirror to Forethread

# One-way sync: codefoundry-dev/F3D (canonical) → Forethread/thecodefoundry.dev
# (read-only mirror). Every push to main/dev force-pushes the same branch to the
# mirror, so the mirror always matches this repo exactly — including after PRs
# are merged in the mirror repo for review visibility (F3D history wins).
#
# Deploys never run from the mirror: deploy.yml / terraform-*.yml are guarded
# with `github.repository == 'codefoundry-dev/F3D'`, and the AWS OIDC trust is
# scoped to codefoundry-dev. Only ci.yml runs there, so mirror PRs still get
# checks.
#
# Auth: FORETHREAD_MIRROR_TOKEN repo secret. The pushing account is an outside
# collaborator on the mirror (not a Forethread org member), so a fine-grained
# PAT can't target the org — this must be a CLASSIC PAT with `repo` scope (or,
# for tighter scoping, a write deploy key added by the org owner). Until the
# secret is set the job warns and exits green (sync simply doesn't happen);
# once set, push failures are real errors.

on:
  push:
    branches: [main, dev]
  # Manual resync / token test: gh workflow run mirror.yml --ref dev
  workflow_dispatch:

concurrency:
  # Serialize per-branch so two rapid pushes can't race each other's force-push.
  group: mirror-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mirror:
    # Never run in the mirror itself (this file gets mirrored too).
    if: github.repository == 'codefoundry-dev/F3D'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history — the mirror needs every commit

      # TEMPORARY diagnostic — prints only non-secret metadata about the token
      # (length, prefix, owning account, scopes, repo reachability) to pin down
      # a "Repository not found" push failure. Remove once the mirror is green.
      - name: Diagnose mirror token
        env:
          MIRROR_TOKEN: ${{ secrets.FORETHREAD_MIRROR_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "secret is EMPTY"; exit 0
          fi
          # Length + prefix identify the token TYPE without revealing it:
          # classic = 'ghp_' and 40 chars; fine-grained = 'gith' and ~93.
          echo "length: ${#MIRROR_TOKEN} (classic PAT = 40, fine-grained = ~93)"
          echo "prefix: ${MIRROR_TOKEN:0:4}"
          case "$MIRROR_TOKEN" in
            *[[:space:]]*) echo "WARNING: token contains whitespace/newline — the paste picked up stray characters" ;;
            *) echo "no stray whitespace" ;;
          esac
          echo "--- identity + scopes ---"
          curl -sS -D /tmp/h -o /tmp/u -H "Authorization: token ${MIRROR_TOKEN}" https://api.github.com/user
          echo "account: $(jq -r '.login // "AUTH FAILED"' /tmp/u)"
          # x-oauth-scopes is empty for fine-grained PATs, populated for classic.
          grep -i '^x-oauth-scopes:' /tmp/h || echo "x-oauth-scopes: (none — not a classic PAT, or no scopes)"
          # SSO-protected orgs advertise themselves here when access is blocked.
          grep -i '^x-github-sso:' /tmp/h || true
          echo "--- mirror repo reachability ---"
          CODE=$(curl -sS -o /tmp/r -w '%{http_code}' -H "Authorization: token ${MIRROR_TOKEN}" https://api.github.com/repos/Forethread/thecodefoundry.dev)
          echo "GET /repos/Forethread/thecodefoundry.dev -> HTTP ${CODE}"
          if [ "$CODE" = "200" ]; then
            echo "push permission: $(jq -r '.permissions.push' /tmp/r)"
          else
            jq -r '.message // empty' /tmp/r
          fi

      - name: Push ${{ github.ref_name }} to Forethread/thecodefoundry.dev
        env:
          MIRROR_TOKEN: ${{ secrets.FORETHREAD_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_TOKEN}" ]; then
            echo "::warning::FORETHREAD_MIRROR_TOKEN is not set — skipping mirror sync. Create a PAT with contents:write on Forethread/thecodefoundry.dev and run: gh secret set FORETHREAD_MIRROR_TOKEN"
            exit 0
          fi
          git push --force \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/Forethread/thecodefoundry.dev.git" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "Mirrored ${GITHUB_REF_NAME} @ ${GITHUB_SHA} to Forethread/thecodefoundry.dev"
