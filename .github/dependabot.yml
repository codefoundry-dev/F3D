# Dependabot version updates (#111).
#
# PRs target `dev`, never `main`: merging to main deploys to prod and applies
# migrations, so updates are checked on staging first like any other change.
# Minor and patch bumps come as one grouped PR a week; a major bump gets its own
# PR so it can be reviewed separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
