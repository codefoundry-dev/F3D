<p style="font-size: 20px; font-weight: 500; line-height: 1.4; color: #000; margin: 0 0 16px">
  {{t.greeting}}
</p>
<p style="font-size: 14px; line-height: 1.5; color: #000; margin: 0 0 24px">{{t.body}}</p>
{{> details heading=t.detailsHeading rows=details}}
<p style="font-size: 14px; line-height: 1.5; color: #000; margin: 0 0 24px">{{t.callToAction}}</p>
{{> button url=replyUrl label=t.buttonLabel}}
<p style="font-size: 14px; line-height: 1.5; color: #000; margin: 24px 0 0">{{t.expiry}}</p>
