<table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin: 0 0 24px">
  <tr>
    <td style="border-left: 3px solid #131313; padding: 4px 0 4px 16px">
      <p
        style="
          font-size: 12px;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #767676;
          margin: 0 0 4px;
        "
      >
        {{label}}
      </p>
      <p style="font-size: 14px; line-height: 1.5; color: #000; margin: 0; white-space: pre-wrap">
        {{text}}
      </p>
    </td>
  </tr>
</table>
