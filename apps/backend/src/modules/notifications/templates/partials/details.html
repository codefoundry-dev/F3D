<p style="font-size: 16px; font-weight: 600; line-height: 1.4; color: #000; margin: 0 0 8px">
  {{heading}}
</p>
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="width: 100%; margin: 0 0 24px; border-top: 1px solid #efefef"
>
  {{#each rows}}
  <tr>
    <td
      style="
        padding: 8px 16px 8px 0;
        border-bottom: 1px solid #efefef;
        font-size: 14px;
        line-height: 1.5;
        color: #767676;
        white-space: nowrap;
        vertical-align: top;
        width: 1%;
      "
    >
      {{this.label}}:
    </td>
    <td
      style="
        padding: 8px 0;
        border-bottom: 1px solid #efefef;
        font-size: 14px;
        line-height: 1.5;
        color: #000;
        vertical-align: top;
      "
    >
      {{this.value}}
    </td>
  </tr>
  {{/each}}
</table>
