<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Brand mark favicon. The SVG is the canonical asset (a copy of
      packages/ui-components/src/assets/icons/logo.svg) and is what modern
      browsers pick, so it stays sharp at every size and pixel density. The PNGs
      are rendered from that same SVG: favicon.png covers browsers without
      SVG-favicon support, and apple-touch-icon.png the iOS home screen, which
      takes no SVG and composites transparency onto black — hence its white
      background.
    -->
    <link rel="icon" href="/favicon.png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forethread</title>
    <!-- Design-system typeface: Urbanist (see packages/config/tailwind/typography.ts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
